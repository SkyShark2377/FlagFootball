<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flag Football Playbook</title>
    <link rel="stylesheet" href="css/style.css">
	<link rel="manifest" href="manifest.json">
    
    <script src="./src/lib/konva.min.js"></script>
    <script src="./src/lib/anime.min.js"></script>
</head>
<body>
    <div id="app-container">
        <header class="app-header">
            <h2 style="margin: 0;">Play Designer</h2>
            
            <div class="header-controls">
                <div class="control-group bg-blue">
                    <button id="btn-telestrator" class="btn-yellow">🖍️ INK</button>
                    <button id="btn-clear-ink" class="btn-light">CLEAR</button>
                </div>

                <div class="control-group bg-light">
                    <select id="playbook-selector" class="dropdown-styled">
                        <option value="">-- Select Play --</option>
                    </select>
                    <button id="btn-save-play" class="btn-blue">💾 SAVE</button>
                </div>

                <div class="control-group bg-dark flex-grow">
                    <label for="timeline-slider" class="text-white">Scrub:</label>
                    <input type="range" id="timeline-slider" min="0" max="100" value="0">
                </div>

                <div class="control-group bg-dark">
                    <label for="speed-slider" class="text-white">Speed:</label>
                    <input type="range" id="speed-slider" min="0.25" max="2" step="0.25" value="1" style="width: 60px;">
                    <button id="btn-play" class="btn-green">PLAY</button>
                    <button id="btn-reset" class="btn-light">RESET</button>
                </div>
                
                <div class="control-group">
                    <select id="formation-selector" class="dropdown-styled">
                        <option value="scrimmage">Line of Scrimmage</option>
                        <option value="singleback">Singleback</option>
                        <option value="spread">Spread (Shotgun)</option>
                        <option value="tripsRight">Trips Right</option>
                    </select>
                    <button id="btn-roster" class="btn-standard">Roster</button>
                    <button id="btn-settings" class="btn-standard">Settings</button>
                </div>
            </div>
        </header>
        
        <div id="portrait-warning">
            <h2>🏈 Please Rotate Your Device</h2>
            <p>The Play Designer requires landscape mode to draw routes properly.</p>
        </div>

        <div id="canvas-container"></div>
        
        <div id="route-menu" class="context-menu"></div>
    </div>

    <div id="roster-panel" class="slide-out">
        <div class="roster-header">
            <h3 style="margin: 0;">Team Roster</h3>
            <button id="btn-close-roster" style="cursor: pointer; background: none; color: white; border: none; font-size: 16px;">X</button>
        </div>
        <div class="roster-form">
            <input type="text" id="new-player-name" placeholder="Name" style="width: 60%;">
            <input type="number" id="new-player-number" placeholder="#" style="width: 25%;">
            <button id="btn-add-player" style="width: 15%;">+</button>
        </div>
        <ul id="roster-list"></ul>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>Data Management</h2>
            <p>Backup or restore your entire team roster and playbook.</p>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button id="btn-export">Backup App Data (Download)</button>
                <label for="file-import" class="upload-btn">Restore from Backup</label>
                <input type="file" id="file-import" accept=".json" style="display: none;">
            </div>
            <button id="btn-close-settings" style="margin-top: 20px; padding: 5px 15px;">Close</button>
        </div>
    </div>

    <script type="module" src="src/app.js"></script>
	<script>
        // Register the Service Worker for Offline PWA support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(registration => {
                    console.log('ServiceWorker registered successfully');
                })
                .catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
